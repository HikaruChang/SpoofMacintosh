name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode & inspect toolchain
        run: |
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve release version and sync manifests
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi
          case "$TAG_NAME" in
            v*) ;;
            *) TAG_NAME="v${TAG_NAME}" ;;
          esac
          VERSION="${TAG_NAME#v}"
          IS_PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || printf '%s\n' "$VERSION" | grep -q '-'; then
            IS_PRERELEASE="true"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"
          ./scripts/bump-version.sh "$VERSION"

      - name: Lint shell scripts
        run: bash -n install.sh scripts/*.sh

      - name: Run Swift unit tests
        run: swift test

      - name: Build & package release archives
        run: ./scripts/package-release.sh "$VERSION"

      - name: Verify signatures, version stamp & SHA-256 checksums
        run: |
          codesign --verify --verbose=2 dist/SpoofMac.kext
          codesign --verify --deep --strict --verbose=2 dist/SpoofMacintosh.app
          VERSION_OUTPUT="$(./dist/spoofmac --version)"
          echo "$VERSION_OUTPUT"
          printf '%s\n' "$VERSION_OUTPUT" | grep -q "v${VERSION}"
          (cd release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: SpoofMacintosh v${{ env.VERSION }}
          body_path: release/RELEASE_NOTES.md
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            release/SpoofMacintosh-v${{ env.VERSION }}-macOS-arm64.dmg
            release/SpoofMacintosh-v${{ env.VERSION }}-Full-Suite-arm64.zip
            release/SHA256SUMS.txt
